<!-- Live Statistics Overview Cards Component -->
<div class="row g-3 mb-4" id="statsOverviewRow">
    <div class="col-6 col-md-4 col-xl-2-4">
        <div class="card border-0 shadow-sm stat-card h-100 border-start border-primary border-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-semibold">Total Audits</div>
                        <h2 class="fw-bold mb-0 text-slate-800" id="stat-total">{{ stats.total }}</h2>
                    </div>
                    <div class="stat-icon bg-primary-subtle text-primary rounded p-2">
                        <i class="bi bi-folder-check fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2-4">
        <div class="card border-0 shadow-sm stat-card h-100 border-start border-success border-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-semibold">Passed Checks</div>
                        <h2 class="fw-bold mb-0 text-success" id="stat-passed">{{ stats.passed }}</h2>
                    </div>
                    <div class="stat-icon bg-success-subtle text-success rounded p-2">
                        <i class="bi bi-check-circle fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4 col-xl-2-4">
        <div class="card border-0 shadow-sm stat-card h-100 border-start border-danger border-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-semibold">Failed Declarations</div>
                        <h2 class="fw-bold mb-0 text-danger" id="stat-failed">{{ stats.failed }}</h2>
                    </div>
                    <div class="stat-icon bg-danger-subtle text-danger rounded p-2">
                        <i class="bi bi-x-circle fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-6 col-xl-2-4">
        <div class="card border-0 shadow-sm stat-card h-100 border-start border-warning border-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-semibold">Manual Review</div>
                        <h2 class="fw-bold mb-0 text-warning" id="stat-review">{{ stats.review }}</h2>
                    </div>
                    <div class="stat-icon bg-warning-subtle text-warning rounded p-2">
                        <i class="bi bi-exclamation-triangle fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-6 col-xl-2-4">
        <div class="card border-0 shadow-sm stat-card h-100 border-start border-info border-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-semibold">Avg. Compliance</div>
                        <h2 class="fw-bold mb-0 text-info" id="stat-avg">{{ stats.avg_score }}%</h2>
                    </div>
                    <div class="stat-icon bg-info-subtle text-info rounded p-2">
                        <i class="bi bi-pie-chart fs-4"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
